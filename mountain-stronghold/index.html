<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=0.5" />
<meta charset="UTF-8">
<style>
	html, body{
    	height: 100%;
	}
	body{
		background-color: black;
		font-family: monospace;
	}
	div#container{
		width: 100%;
    	height: 100%;
    	margin: 0 auto;
    	text-align: center;
	}
	div#title{
		position: relative;
		width:530px;
		height:130px;
		color: white;
		top: 0;
		margin: 0 auto;
		word-wrap: break-word;
		white-space: pre-wrap;
		word-break: break-word;
		margin-bottom: 0px; //give some space at the bottom
		float: left;
	}
	div#header{
		margin: 0 auto; //center
		position: relative;
		width:530px;
		height:30px;
		color:white;
	}
	div#desc{
		position: relative;
		width:530px;
		height:170px;
		color: white;
		top: 0;
		margin: 0 auto;
		word-wrap: break-word;
		white-space: pre-wrap;
		word-break: break-word;
		//margin-bottom: 10px; //give some space at the bottom
		float: left;
	}
	p#name{
		font-size: 50pt;
		font-family: Helvetica;
		font-weight: 600;
		float: left;
		text-align: left
	}
	p#descSmall{
		display: block;
		text-align: left;
		color:#ababab;
	}
	#descCont{
		color:white;
	}
	div#map{
		display: inline-block; //center
		text-align: left; //center
		width:530px;
		height:450px;
		padding: 0;
		margin: 0 auto;
		color: white;
		width:100%;
	}
	div#elevation{
		position: relative;
		border:1px dashed white;
		width:590px;
		height:190px;
		color: white;
		top: 0;
		margin: 0 auto;
		word-wrap: break-word;
		white-space: pre-wrap;
		word-break: break-word;
		margin-bottom: 40px; //give some space at the bottom
	}
	div#elevationLegend{
		padding:10px;
		margin: 0;
		top:0;
		position: absolute;
		width: 95%;
		text-align:left;
		
	}
	div#elevation hr{
		position: relative;
		color: blue;
		top: 75px;
	}
	div#chart {
		position: relative;
		border:1px dashed white;
		width:590px;
		height:400px;
		color: white;
		top: 0;
		margin: 0 auto;
		word-wrap: break-word;
		white-space: pre-wrap;
		word-break: break-word;
		margin-bottom: 10px;
		letter-spacing: 0.5em;
	}
	div#chartLegend{
		padding:10px;
		margin: 0;
		top:0;
		position: absolute;
		width: 95%;
		text-align:left;
		
	}
	div#navi{
		color:white;
		cursor:pointer;
		font-size: 20pt;
		font-family: Helvetica;
		font-weight: 600;
	}
	</style>
	<script type="text/javascript" src="http://livejs.com/live.js"></script> <!-- live reload -->
	<script type="text/javascript" src="database.json"></script> <!-- database -->
	<title>Mountain Stronghold Datacenter Database</title>
</head>

<body>
<div id="container">
	<div id="header"></div>
	<div id="title"></div>
	<div id="map"></div>
	<div id="desc"></div>
	<div id="elevation">
		<div id="elevationLegend">ELEVATION / 海拔</div>
		<hr>
	</div>

	<div id="chart">
		<div id="chartLegend"></div>
	</div>

	<div id="navi">
		<p onmousedown="window.location.reload();">Next / 下页</p>
	</div>
</div>	
</body>

<script>
	//load database
	var numEntries = 63//define number of entries in the database
 	var data = JSON.parse(data);
 	var random = Math.floor(Math.random() * numEntries);  
 	
 	//header index number
 	document.getElementById('header').innerHTML += "<p style='float:left'>"+ random.toString().padStart(4, '0') +" of "+ numEntries.toString().padStart(4, '0')+"</p>";
 	//header location
 	document.getElementById('header').innerHTML += "<p style='float:right'>Location: "+ data[random].city+", "+data[random].country;+"</p>";
 

 	

 	console.log(data[random].latlong);
 	//world map
 	const latlong = data[random].latlong.split(",", 2); //split lat,long sting into seperate latitude and longitude


	if (latlong.length < 2) { //check if array is set or not
		document.getElementById('map').innerHTML += "<p style='padding:10px;'>no location data found / 未找到 </p>"; //message if no data is found
		//var color="white"; // hack
		//var lat = 10; //hack
		//var lon = 10; //hack

	} else {
		var color="yellow";
		var lat = parseFloat(latlong[0]); //parse latitude string as float
		var lon = parseFloat(latlong[1]); //parse longitude string as float
	}

//description
	document.getElementById('title').innerHTML += "<p id='name'>"+data[random].name+"</p>";
 	if(data[random].company){document.getElementById('desc').innerHTML += "<p id='descSmall'>COMPANY <span id='descCont'>"+data[random].company+"</span></p>";}
 	if(data[random].geology){ document.getElementById('desc').innerHTML += "<p id='descSmall'>GEOLOGY <span id='descCont'>"+data[random].geology+"</span></p>";}
 	if(data[random].former_use){ document.getElementById('desc').innerHTML += "<p id='descSmall'>FORMER USE <span id='descCont'>"+data[random].former_use+"</span></p>";}
 	if(data[random].pue){ document.getElementById('desc').innerHTML += "<p id='descSmall'>POWER EFFECTIVENESS (PUE) <span id='descCont'>"+data[random].pue+"</span></p>";}
 	if(data[random].features){ document.getElementById('desc').innerHTML += "<p id='descSmall'>FEATURES <span id='descCont'>"+data[random].features+"</span></p>";}
	document.getElementById('desc').innerHTML += "<p id='descSmall'>LAT,LONG <span id='descCont'>"+ data[random].latlong+"</span></p>";

	//elevation 
	let text = "";
	var x = 0; //datastorage

	if (!data[random].elevation.length) { // elevation data is not found
		var elevation = data[random].elevation;
		document.getElementById('elevation').innerHTML += "<p style='padding:10px;'"+text+"</p>"; //drawing
		document.getElementById('elevation').innerHTML += "<p style='padding:0px;color:blue;'>SEALEVEL / 海平面</p>"; //draw elevation
		document.getElementById('elevationLegend').innerHTML += "<span style='float:right;'>NO DATA / 未找到</span>"; //draw elevation
	} else {
		var elevation = data[random].elevation;
		for (let i = 0; i < 72; i++) {
			x = Math.sin(i/-23) * elevation/10;
  			text += "<span style='position:relative;top:"+x+"px'>_</span>";
		} 
		//draw graph
		document.getElementById('elevation').innerHTML += "<p style='padding:10px;'"+text+"</p>"; //drawing
		document.getElementById('elevation').innerHTML += "<p style='padding:0px;color:blue;'>SEALEVEL / 海平面</p>"; //draw elevation
		document.getElementById('elevationLegend').innerHTML += "<span style='float:right;'>"+elevation+" m</span>"; //draw elevation
	}

	//PUE
	if (!data[random].pue) { 
		document.getElementById('chartLegend').innerHTML += "<span style='float:right;'>NO DATA / 未找到</span>"; //draw elevation


	} else {
		//draw pie chart
		val = 1 - parseFloat(data[random].pue);
		valInv = val*-1;
		document.getElementById('chartLegend').innerHTML += "<span style='float:left;'>PUE</span>"; //draw PUE
		document.getElementById('chartLegend').innerHTML += "<span style='float:right;'>"+data[random].pue+"</span>"; //draw PUE
		document.getElementById('chart').innerHTML += "<p style='text-align:center;'>"+pieChart(valInv)+"</p>";
	}











	function pieChart(val) {
		var v = [val-0.01, 0.0, 0.0, 1]; //values, with some offsets
		var k = ["#", "#",  "#",  "."]; //ascii symbols to use
		var r = 10; // radius of the chart
		d=r*2;
		M=Math;
		R=M.round;
		p=[];
		for(y=0;y<d;y++){
			p[y]=[];
			for(x=0;x<d;x++)
				p[y][x]=" "
		}
		t=0;
		i=-1;
		for(f=0;f<1;f+=1/(r*20))
			{if(f>t)
				t+=v[++i];
				a=M.PI*2*f;
				for(j=0;j<r;j++)
					p[R(M.sin(a)*j)+r][R(M.cos(a)*j)+r]=k[i]}s="";
				for(y=0;y<d;y++){	
					for(x=0;x<d;x++)
						s+=p[y][x];
						s+="\n";
				}
		return s; //return chart 
	}
