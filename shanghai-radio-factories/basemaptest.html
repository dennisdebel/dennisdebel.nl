<html>
  <head>
    <meta charset="utf-8" />
    <title>Display a basemap layer with labels</title>
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Load Esri Leaflet from CDN -->
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>

    <!-- Load Esri Leaflet Vector from CDN -->
    <script src="https://unpkg.com/esri-leaflet-vector@4.2.3/dist/esri-leaflet-vector.js" crossorigin=""></script>
    <style>
      html,
      body,
      #map {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        color: #323232;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const apiKey = "YAAPK5312de8a28b94df5844a6f1756f6088es7xWUsmVy9sCR62wNVx5bg5knHvFGH8piEjJgPfYtgys0MZPh1d0RRBx4A37eAGG";

      const map = L.map("map").setView([37.75, -122.23], 10);

      L.esri.Vector.vectorBasemapLayer("arcgis/imagery", {
        apikey: apiKey
      }).addTo(map);
    </script>
  </body>
</html>
