<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin DJ</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: white;
        color: black;
        font-family: sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #ui {
        text-align: center;
    }

    #disc {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 40px rgba(255,255,255,0.15);
        margin-bottom: 20px;
    }

    button, input {
        margin-top: 10px;
        font-size: 16px;
    }

    #stats {
        margin-top: 20px;
        opacity: 0.8;
        line-height: 1.5;
    }
</style>
</head>
<body>

<div id="ui">

    <img id="disc"
        src="./record.webp">

    <br>

    <input type="file" id="fileInput">

    <br>

    <button id="startBtn">Enable Motion + Play</button>

    <div id="stats">
        speed: 1.00x<br>
        spin velocity: 0
    </div>

</div>

<script>

const disc = document.getElementById("disc");
const startBtn = document.getElementById("startBtn");
const fileInput = document.getElementById("fileInput");
const stats = document.getElementById("stats");

let audio = new Audio();
audio.loop = true;

let discRotation = 0;
let discVelocity = 0;

let playbackRate = 1.0;

let smoothedAlpha = 0;

const maxRate = 1.5;
const minRate = 0.5;

fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
        audio.src = URL.createObjectURL(file);
    }
});

startBtn.addEventListener("click", async () => {

    // iPhone permission
    if (
        typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function"
    ) {
        try {
            const permission = await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {
                alert("Motion permission denied");
                return;
            }
        } catch (e) {
            console.error(e);
        }
    }

    startMotion();

    if (audio.src) {
        audio.play();
    }

    startBtn.style.display = "none";
});

function startMotion() {

    window.addEventListener("devicemotion", (event) => {

        let alpha = event.rotationRate?.alpha || 0;

        // smooth sensor
        smoothedAlpha = smoothedAlpha * 0.8 + alpha * 0.2;

        // visual spinning
        discVelocity += smoothedAlpha * 0.03;

        // clamp visual speed
        discVelocity = Math.max(Math.min(discVelocity, 60), -60);

        // AUDIO CONTROL
        //
        // clockwise -> faster
        // counterclockwise -> slower

        // convert spin speed into playback %
        let targetRate = 1 + (smoothedAlpha * 0.003);

        // clamp
        targetRate = Math.max(minRate, Math.min(maxRate, targetRate));

        // smooth audio rate
        playbackRate += (targetRate - playbackRate) * 0.2;

        audio.playbackRate = playbackRate;

    });
}

function animate() {

    discRotation += discVelocity;

    // friction
    discVelocity *= 0.985;

    disc.style.transform = `rotate(${discRotation}deg)`;

    stats.innerHTML = `
        speed: ${playbackRate.toFixed(2)}x<br>
        spin velocity: ${discVelocity.toFixed(1)}
    `;

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
