<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin DJ</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: white;
        color: black;
        font-family: sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #ui {
        text-align: center;
    }

    #disc {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 40px rgba(255,255,255,0.15);
        margin-bottom: 20px;
    }

    button, input {
        margin-top: 10px;
        font-size: 16px;
    }

    #stats {
        margin-top: 20px;
        opacity: 0.8;
        line-height: 1.5;
    }
</style>
</head>
<body>

<div id="ui">

    <img id="disc"
        src="./record.webp">

    <br>

    <input type="file" id="fileInput">

    <br>

    <button id="startBtn">Enable Motion + Play</button>

    <div id="stats">
        speed: 1.00x<br>
        spin velocity: 0
    </div>

</div>

<script>
const disc = document.getElementById("disc");
const startBtn = document.getElementById("startBtn");
const fileInput = document.getElementById("fileInput");
const stats = document.getElementById("stats");

// AUDIO
let audio = new Audio();

audio.loop = true;
audio.preload = "auto";
audio.playsInline = true;

// VISUAL DISC
let discRotation = 0;
let discVelocity = 0;

// AUDIO SPEED
let playbackRate = 1.0;

// SENSOR SMOOTHING
let smoothedAlpha = 0;

// SPEED LIMITS
const maxRate = 1.2;
const minRate = 0.8;

// LOAD AUDIO FILE
fileInput.addEventListener("change", (e) => {

    const file = e.target.files[0];

    if (!file) return;

    console.log("loading:", file.name);

    const url = URL.createObjectURL(file);

    audio.src = url;

    audio.load();

    audio.oncanplaythrough = () => {
        console.log("audio ready");
    };

    audio.onerror = (err) => {
        console.error("audio error", err);
        alert("Could not load audio file");
    };
});

// START BUTTON
startBtn.addEventListener("click", async () => {

    // iPhone motion permission
    if (
        typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function"
    ) {
        try {

            const permission =
                await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {
                alert("Motion permission denied");
                return;
            }

        } catch (e) {
            console.error(e);
        }
    }

    // make sure audio exists
    if (!audio.src) {
        alert("Please load an audio file first");
        return;
    }

    try {

        // IMPORTANT:
        // must happen directly in user gesture

        await audio.play();

        console.log("audio started");

    } catch (e) {

        console.error("play failed:", e);

        alert("Audio playback failed");

        return;
    }

    startMotion();

    startBtn.style.display = "none";
});

// MOTION CONTROL
function startMotion() {

    window.addEventListener("devicemotion", (event) => {

        // spinning around vertical axis
        let alpha = event.rotationRate?.alpha || 0;

        // smooth sensor
        smoothedAlpha =
            smoothedAlpha * 0.8 +
            alpha * 0.2;

        // VISUAL DISC ROTATION
        discVelocity += smoothedAlpha * 0.03;

        // clamp visual speed
        discVelocity = Math.max(
            Math.min(discVelocity, 60),
            -60
        );

        // AUDIO SPEED CONTROL
        //
        // clockwise -> faster
        // counterclockwise -> slower

        let targetRate =
            1 + (smoothedAlpha * 0.002);

        // clamp speed
        targetRate = Math.max(
            minRate,
            Math.min(maxRate, targetRate)
        );

        // smooth playback changes
        playbackRate +=
            (targetRate - playbackRate) * 0.15;

        audio.playbackRate = playbackRate;

    });
}

// ANIMATION LOOP
function animate() {

    discRotation += discVelocity;

    // friction
    discVelocity *= 0.985;

    disc.style.transform =
        `rotate(${discRotation}deg)`;

    stats.innerHTML = `
        speed: ${playbackRate.toFixed(2)}x<br>
        spin velocity: ${discVelocity.toFixed(1)}
    `;

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
