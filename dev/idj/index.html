<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin DJ</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: white;
        color: black;
        font-family: sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #ui {
        text-align: center;
    }

    #disc {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 40px rgba(255,255,255,0.15);
        margin-bottom: 20px;
    }

    button, input {
        margin-top: 10px;
        font-size: 16px;
    }

    #stats {
        margin-top: 20px;
        opacity: 0.8;
        line-height: 1.5;
    }
</style>
</head>
<body>

<div id="ui">

    <img id="disc"
        src="./record.webp">

    <br>

    <input type="file" id="fileInput">

    <br>

    <button id="startBtn">Enable Motion + Play</button>

    <div id="stats">
        speed: 1.00x<br>
        spin velocity: 0
    </div>

</div>

<script>
const disc = document.getElementById("disc");
const startBtn = document.getElementById("startBtn");
const fileInput = document.getElementById("fileInput");
const stats = document.getElementById("stats");

// WEB AUDIO
let audioContext;
let sourceNode;
let audioBuffer;

// DISC
let discRotation = 0;
let discVelocity = 0;

// SENSOR
let smoothedAlpha = 0;

// PLAYBACK
let playbackRate = 1.0;
let targetRate = 1.0;

// FILE LOAD
fileInput.addEventListener("change", async (e) => {

    const file = e.target.files[0];

    if (!file) return;

    const arrayBuffer = await file.arrayBuffer();

    if (!audioContext) {
        audioContext =
            new (window.AudioContext ||
             window.webkitAudioContext)();
    }

    audioBuffer =
        await audioContext.decodeAudioData(arrayBuffer);

    console.log("audio loaded");
});

// START
startBtn.addEventListener("click", async () => {

    // iPhone motion permission
    if (
        typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function"
    ) {
        try {

            const permission =
                await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {
                alert("Motion permission denied");
                return;
            }

        } catch (e) {
            console.error(e);
        }
    }

    if (!audioBuffer) {
        alert("Load audio first");
        return;
    }

    // resume audio context
    await audioContext.resume();

    // CREATE SOURCE
    sourceNode =
        audioContext.createBufferSource();

    sourceNode.buffer = audioBuffer;

    sourceNode.loop = true;

    sourceNode.playbackRate.value = 1.0;

    sourceNode.connect(audioContext.destination);

    sourceNode.start();

    startMotion();

    startBtn.style.display = "none";

});

// MOTION
function startMotion() {

    window.addEventListener("devicemotion", (event) => {

        let alpha =
            event.rotationRate?.alpha || 0;

        // smooth sensor
        smoothedAlpha =
            smoothedAlpha * 0.9 +
            alpha * 0.1;

        // VISUAL DISC
        discVelocity += smoothedAlpha * 0.03;

        discVelocity = Math.max(
            Math.min(discVelocity, 50),
            -50
        );

        // AUDIO SPEED
        targetRate =
            1 + (smoothedAlpha * 0.002);

        // clamp
        targetRate = Math.max(
            0.8,
            Math.min(1.2, targetRate)
        );

    });

}

// AUDIO UPDATE LOOP
function updateAudio() {

    if (sourceNode) {

        playbackRate +=
            (targetRate - playbackRate) * 0.08;

        sourceNode.playbackRate.value =
            playbackRate;

    }

    requestAnimationFrame(updateAudio);
}

updateAudio();

// VISUAL LOOP
function animate() {

    discRotation += discVelocity;

    discVelocity *= 0.985;

    disc.style.transform =
        `rotate(${discRotation}deg)`;

    stats.innerHTML = `
        speed: ${playbackRate.toFixed(3)}x<br>
        spin: ${discVelocity.toFixed(1)}
    `;

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
