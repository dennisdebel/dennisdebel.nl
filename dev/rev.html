<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Throttle Phone Sensor</title>

<style>
body {
  margin: 0;
  background: #0b0f14;
  color: #e9eef5;
  font-family: system-ui, sans-serif;
  text-align: center;
}

#scene {
  width: 260px;
  height: 260px;
  margin: 20px auto;
  perspective: 900px;
}

#phone {
  width: 120px;
  height: 220px;
  margin: auto;
  background: linear-gradient(#111, #222);
  border-radius: 14px;
  border: 2px solid #4af;
  transform-style: preserve-3d;
}

button {
  margin: 8px;
  padding: 10px 16px;
  border-radius: 10px;
  border: none;
  background: #1f6feb;
  color: white;
  font-weight: 600;
}
#info {
  font-variant-numeric: tabular-nums;
  font-size: 14px;
}
</style>
</head>

<body>

<h3>Phone-Throttle Debug</h3>

<div id="scene">
  <div id="phone"></div>
</div>

<button id="btnSensors">Enable sensors</button>
<button id="btnAudio">Enable audio</button>

<div id="info">
  angle: <span id="angle">0</span>°<br>
  gps: <span id="gps">0</span> km/h<br>
  pitch: <span id="pitch">0</span>
</div>

<script>
/* ------------------ utilities ------------------ */
const deg2rad = d => d * Math.PI / 180;
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const lerp = (a,b,t)=>a+(b-a)*t;

/* ------------------ 3D rotation ------------------ */
const phoneEl = document.getElementById("phone");

function orientationMatrix(alpha, beta, gamma){
  const x = deg2rad(beta);
  const y = deg2rad(gamma);
  const z = deg2rad(alpha);

  const cx=Math.cos(x), sx=Math.sin(x);
  const cy=Math.cos(y), sy=Math.sin(y);
  const cz=Math.cos(z), sz=Math.sin(z);

  return [
    cz*cy - sz*sx*sy, -cx*sz, cz*sy + cy*sz*sx, 0,
    cy*sz + cz*sx*sy,  cx*cz, sz*sy - cz*cy*sx, 0,
    -cx*sy,            sx,     cx*cy,           0,
    0,0,0,1
  ];
}

function applyMatrix(m){
  phoneEl.style.transform = `matrix3d(${m.join(",")})`;
}

/* ------------------ throttle angle ------------------ */
let angleLP = 0;
function smoothAngle(x){
  const k = 0.15;
  angleLP += k * (x - angleLP);
  return angleLP;
}

/* ------------------ GPS ------------------ */
let gpsSpeed = 0;
navigator.geolocation.watchPosition(
  p=>{
    gpsSpeed = (p.coords.speed || 0) * 3.6;
    document.getElementById("gps").textContent = gpsSpeed.toFixed(1);
  },
  ()=>{},
  { enableHighAccuracy:true, maximumAge:500 }
);

/* ------------------ audio ------------------ */
let audioCtx, osc, gain;
let audioOn = false;

function startAudio(){
  if(audioCtx) return;
  audioCtx = new AudioContext();
  osc = audioCtx.createOscillator();
  gain = audioCtx.createGain();
  osc.type = "sawtooth";
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.value = 0;
  osc.start();
}

function setPitch(norm){
  if(!audioOn) return;
  const freq = 80 + norm * 320;
  osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.02);
  gain.gain.setTargetAtTime(0.12, audioCtx.currentTime, 0.08);
  document.getElementById("pitch").textContent = freq.toFixed(0);
}

/* ------------------ sensor handling ------------------ */
document.getElementById("btnSensors").onclick = async ()=>{
  if(DeviceOrientationEvent.requestPermission){
    await DeviceOrientationEvent.requestPermission();
  }

  window.addEventListener("deviceorientation", e=>{
    if(e.beta===null) return;

    const alpha = e.alpha || 0;
    const beta  = -e.beta;   // ← FIXED AXIS
    const gamma = e.gamma || 0;

    const m = orientationMatrix(alpha, beta, gamma);
    applyMatrix(m);

    const angle = smoothAngle(beta);
    document.getElementById("angle").textContent = angle.toFixed(1);

    /* ---- blend throttle & GPS ---- */
    const throttleNorm = clamp(((-angle) + 30) / 60, 0, 1);
    const gpsNorm = clamp(gpsSpeed / 40, 0, 1);
    const mix = clamp(gpsSpeed / 5, 0, 1); // >5km/h → GPS dominates
    const norm = lerp(throttleNorm, gpsNorm, mix);

    setPitch(norm);
  });
};

/* ------------------ audio button ------------------ */
document.getElementById("btnAudio").onclick = async ()=>{
  startAudio();
  if(audioCtx.state==="suspended") await audioCtx.resume();
  audioOn = !audioOn;
  if(!audioOn) gain.gain.value = 0;
};
</script>
</body>
</html>
