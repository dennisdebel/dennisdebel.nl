<script>
/* ---------- throttle / sensors ---------- */
let angleLP = 0;
let angleZero = 0;
const smoothing = 0.08;     // smaller = smoother, slower
const deadzone = 1;         // degrees, ignore tiny jitter
const zeroThreshold = 1;    // degrees for revdown.wav trigger

function smoothAngle(x){
  const delta = x - angleLP;
  // apply deadzone
  if(Math.abs(delta) < deadzone) return angleLP;
  angleLP += smoothing * delta;
  return angleLP;
}

/* ---------- engine audio ---------- */
function setEngine(norm){
  if(!audioOn) return;

  // Revdown only near zero angle
  if(Math.abs(angleLP) < zeroThreshold){
    gainUp.gain.setTargetAtTime(0, audioCtx.currentTime, 0.06);
    gainDown.gain.setTargetAtTime(0.18, audioCtx.currentTime, 0.08);
    // keep playback rate stable near zero
    srcUp.playbackRate.setTargetAtTime(1, audioCtx.currentTime, 0.03);
    srcDown.playbackRate.setTargetAtTime(1, audioCtx.currentTime, 0.03);
    prevNorm = 0;
    return;
  }

  // regular throttle engine
  const rate = 0.6 + norm * 1.6;
  srcUp.playbackRate.setTargetAtTime(rate, audioCtx.currentTime, 0.03);
  srcDown.playbackRate.setTargetAtTime(rate, audioCtx.currentTime, 0.03);

  const rising = norm > prevNorm;
  gainUp.gain.setTargetAtTime(rising ? 0.25 : 0, audioCtx.currentTime, 0.06);
  gainDown.gain.setTargetAtTime(rising ? 0 : 0, audioCtx.currentTime, 0.08);

  prevNorm = norm;
}

/* ---------- device orientation listener ---------- */
document.getElementById("btnSensors").onclick = async ()=>{
  if(DeviceOrientationEvent.requestPermission){
    await DeviceOrientationEvent.requestPermission();
  }

  window.addEventListener("deviceorientation", e=>{
    if(e.beta==null) return;

    const alpha = e.alpha || 0;
    const beta  = -e.beta; // forward/back tilt
    const gamma = e.gamma || 0; 

    // 3D visual
    applyMatrix(orientationMatrix(alpha, beta, gamma));

    // smoothed angle with deadzone
    const angle = smoothAngle(beta - angleZero);
    document.getElementById("angle").textContent = angle.toFixed(1);

    // throttle from angle
    const throttle = clamp(((-angle) + 30) / 60, 0, 1);

    // GPS mixing
    let mix = 0;
    if(gpsSpeed > 5) mix = clamp((gpsSpeed - 5)/10, 0, 1);
    document.getElementById("mix").textContent = mix.toFixed(2);

    const gpsNorm = clamp(gpsSpeed / 40, 0, 1);
    const norm = lerp(throttle, gpsNorm, mix);

    setEngine(norm);
  });
};

/* ---------- calibration button ---------- */
document.getElementById("btnCal").onclick = ()=>{
  angleZero = angleLP;
};
</script>
