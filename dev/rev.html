<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Throttle Phone Engine</title>

<style>
body{
  margin:0;
  background:#0b0f14;
  color:#e9eef5;
  font-family:system-ui;
}
#ui{
  position:fixed;
  top:10px; left:10px;
  background:#121a24;
  padding:10px 12px;
  border-radius:10px;
  font-size:14px;
}
button{
  padding:8px 12px;
  border-radius:8px;
  border:0;
  background:#1f6feb;
  color:white;
  font-weight:600;
}
canvas{ display:block }
</style>
</head>

<body>
<canvas id="gl"></canvas>

<div id="ui">
  <button id="btn">Enable sensors + sound</button>
  <div>Angle: <span id="ang">0</span>°</div>
  <div>Throttle: <span id="thr">0</span></div>
  <div>Speed: <span id="spd">0</span> km/h</div>
</div>

<script>
/* =======================
   BASIC STATE
======================= */
let angleLP = 0;
let throttle = 0;
let speedKmh = 0;

const angEl = document.getElementById("ang");
const thrEl = document.getElementById("thr");
const spdEl = document.getElementById("spd");

/* =======================
   AUDIO
======================= */
let audioCtx, osc, gain;

function initAudio(){
  audioCtx = new AudioContext();
  osc = audioCtx.createOscillator();
  gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = 80;
  gain.gain.value = 0.0;

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
}

function updateSound(){
  const base = 80;
  const max = 420;

  const gpsFactor = speedKmh > 5
    ? Math.min(speedKmh / 50, 1)
    : 0.3;

  const freq = base + throttle * max * gpsFactor;
  osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.02);
  gain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.05);
}

/* =======================
   ACCELEROMETER
======================= */
function handleMotion(e){
  const g = e.accelerationIncludingGravity;
  if(!g) return;

  // phone mounted face-up, rotating forward/back
  const angleRad = Math.atan2(g.y, g.z);
  const angleDeg = angleRad * 180 / Math.PI;

  // LOW-PASS FILTER (reject vibration)
  const alpha = 0.12;
  angleLP = angleLP * (1-alpha) + angleDeg * alpha;

  // clamp usable throttle range
  const minAng = -20;
  const maxAng = 35;

  let x = (angleLP - minAng) / (maxAng - minAng);
  x = Math.max(0, Math.min(1, x));

  throttle = x;

  angEl.textContent = angleLP.toFixed(1);
  thrEl.textContent = throttle.toFixed(2);

  updateSound();
}

/* =======================
   GPS
======================= */
navigator.geolocation.watchPosition(p=>{
  const v = p.coords.speed; // m/s
  if(v != null){
    speedKmh = v * 3.6;
    spdEl.textContent = speedKmh.toFixed(1);
  }
},{ enableHighAccuracy:true });

/* =======================
   3D VISUALIZATION (MINIMAL)
======================= */
const canvas = document.getElementById("gl");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.rotate(angleLP * Math.PI/180);

  ctx.fillStyle="#7cc4ff";
  ctx.fillRect(-80,-140,160,280);

  ctx.restore();

  requestAnimationFrame(draw);
}
draw();

/* =======================
   PERMISSION BUTTON
======================= */
document.getElementById("btn").onclick = async ()=>{
  if(DeviceMotionEvent.requestPermission){
    await DeviceMotionEvent.requestPermission();
  }
  initAudio();
  window.addEventListener("devicemotion", handleMotion, {frequency:60});
};
</script>
</body>
</html>
