<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Throttle Debug</title>

<style>
body{
  margin:0;
  background:#0b0f14;
  color:#e9eef5;
  font-family:system-ui;
}
#ui{
  position:fixed;
  top:10px; left:10px;
  background:#121a24;
  padding:12px;
  border-radius:12px;
  font-size:14px;
  z-index:10;
}
button{
  padding:8px 12px;
  border-radius:8px;
  border:0;
  background:#1f6feb;
  color:white;
  font-weight:600;
}
.row{margin-top:6px}
canvas{display:block}
</style>
</head>

<body>
<canvas id="c"></canvas>

<div id="ui">
  <button id="start">Enable sensors + sound</button>
  <div class="row">Motion: <b id="mstat">off</b></div>
  <div class="row">GPS: <b id="gstat">off</b></div>
  <div class="row">Angle: <b id="angle">—</b>°</div>
  <div class="row">Throttle: <b id="thr">—</b></div>
  <div class="row">Speed: <b id="spd">—</b> km/h</div>
</div>

<script>
/* ================= STATE ================= */
let angleLP = 0;
let throttle = 0;
let speedKmh = 0;

/* ================= UI ================= */
const angleEl = document.getElementById("angle");
const thrEl = document.getElementById("thr");
const spdEl = document.getElementById("spd");
const mstat = document.getElementById("mstat");
const gstat = document.getElementById("gstat");

/* ================= AUDIO ================= */
let audioCtx, osc, gain;

function initAudio(){
  audioCtx = new AudioContext();
  osc = audioCtx.createOscillator();
  gain = audioCtx.createGain();

  osc.type = "sawtooth";
  osc.frequency.value = 80;
  gain.gain.value = 0;

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
}

function updateSound(){
  if(!audioCtx) return;

  const base = 70;
  const max = 500;

  const gpsFactor = speedKmh > 5
    ? Math.min(speedKmh / 60, 1)
    : 0.25;

  const freq = base + throttle * max * gpsFactor;
  osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.03);
  gain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.06);
}

/* ================= MOTION ================= */
function onMotion(e){
  const g = e.accelerationIncludingGravity;
  if(!g) return;

  // forward/back tilt (phone face up, clamped to throttle)
  const ang = Math.atan2(g.y, g.z) * 180/Math.PI;

  // LOW-PASS FILTER (kills bumps)
  angleLP = angleLP * 0.85 + ang * 0.15;

  // map to throttle
  const minA = -20;
  const maxA = 35;
  throttle = Math.max(0, Math.min(1, (angleLP-minA)/(maxA-minA)));

  angleEl.textContent = angleLP.toFixed(1);
  thrEl.textContent = throttle.toFixed(2);

  updateSound();
}

/* ================= GPS (FIXED) ================= */
function startGPS(){
  navigator.geolocation.watchPosition(
    pos=>{
      if(pos.coords.speed != null){
        speedKmh = pos.coords.speed * 3.6;
        spdEl.textContent = speedKmh.toFixed(1);
        gstat.textContent = "on";
      }
    },
    err=>{
      gstat.textContent = "error";
    },
    { enableHighAccuracy:true }
  );
}

/* ================= 3D DEBUG VIS ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);

  // fake 3D: rotate rectangle in perspective
  const r = angleLP * Math.PI/180;
  const w = 160;
  const h = 280;

  ctx.transform(1, Math.sin(r)*0.8, 0, Math.cos(r), 0, 0);
  ctx.fillStyle = "#7cc4ff";
  ctx.fillRect(-w/2, -h/2, w, h);

  ctx.restore();
  requestAnimationFrame(draw);
}
draw();

/* ================= START BUTTON ================= */
document.getElementById("start").onclick = async ()=>{
  if(DeviceMotionEvent.requestPermission){
    const p = await DeviceMotionEvent.requestPermission();
    if(p !== "granted") return;
  }

  initAudio();
  window.addEventListener("devicemotion", onMotion, {frequency:60});
  mstat.textContent = "on";
  startGPS();
};
</script>
</body>
</html>
