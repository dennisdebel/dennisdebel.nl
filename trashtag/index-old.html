<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>trashtag - tracking e-waste with e-waste (airtags)</title>
	
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" integrity="sha512-hoalWLoI8r4UszCkZ5kL8vayOGVae1oxXe/2A4AO6J9+580uKHDO3JdHb7NzwwzK5xr/Fs0W40kiNHxM9vyTtQ==" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js" integrity="sha512-BB3hKbKWOc9Ez/TAwyWxNXeoV9c1v6FIeYiBieIWkpLjauysF18NzgR1MBNBXf8/KABdlkX68nAhlwcDFLGPCQ==" crossorigin=""></script>

     <script src="https://cdnjs.cloudflare.com/ajax/libs/mapbox-gl/1.13.1/mapbox-gl.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mapbox-gl-leaflet/0.0.15/leaflet-mapbox-gl.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mapbox-gl/1.13.1/mapbox-gl.min.css" />


 	<script src="js/leaflet.curve.js"></script>
    <script src="js/leaflet.motion.min.js"></script> 
   
	
	<style>
		html, body {
			height: 100%;
			margin: 0;
			padding: 0; 
			margin: 0; 
			font-family: sans-serif;
			color: #f7f7f7;
			background-color: #000;
		}
		.leaflet-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}
		#map { 
			float: right;
			height: 100%; 
			width: 70vw; 
		}
		#overlay{
			position: absolute;
			padding: 20px;
			width: 35vw;
			height: 100%;
			z-index: 1000;
			background-color: #000;
		}
		
		/* MARKERS */
		.emoMarker{ 
			font-size: 20px; 
		}
		
		/* FONTS */ 
		a{
			color: white;
		}
		h1{
			padding: 0;
			margin: 0;
		}
		#tiny{
			font-size: 8pt;
		}
		#expand{
			display: none;
		}
		/* mobile style */
		@media (pointer:none), (pointer:coarse) {
			.leaflet-interactive { z-index: 0 !important; } /* fix for safari z-index pinch zoom glitch*/
			#map { 
				height: 100%; 
				width: 100vw; 
			}
			#overlay{
				position: absolute;
				width: 90%;
				height: 25%;
				z-index: 1000;
				background-color: #000;
			}
			.leaflet-control-attribution{
				display: none;
			}
			#expand{
				display: inline-block;
			}
			#attribution{
				display: none;

			}
		}

	</style>
</head>
<body>

<div id='overlay'>
	<h1>Trash-tag</h1>
	<span id='tiny'>Tracking e-waste with airtags</span>
	<div>
		<br>
		One day I decided to put an airtag in an broken printer and bring it to the munincipal recycling place. Follow its journey here. 
		<!--ETHICAL QUESTIONS: 1: creates more e-waste...but should be disposed of properly if the host ewaste is recycled properly.. 2: tracking is not disclosed..how to approach this -->
		<div id='attribution'>
			<a href="https://www.maptiler.com" style="position:absolute;left:10px;bottom:30px;z-index:999;"><img src="https://api.maptiler.com/resources/logo.svg" alt="MapTiler logo">
			</a>
		</div>
	</div>
	<!--<div id='expand'><br><a href=''>More info</a></div>-->
</div>
<div id='map'></div>

<script>
	//data points
	var jsonData = [
	{
		"LAT":51.868374815532164,
		"LNG":4.455605206115576,
	    "NAME": "Munincipal Dump, Rotterdam",
	    "TIME": 1659185901000
	},
	{
		"LAT":51.89875709934995,
		"LNG":4.318347232389512,
	    "NAME": "Recycling Place, Harbor Vlaardingen",
	    "TIME": 1659607624000
	},
	{
		"LAT":52.144406299999986,
		"LNG":4.514479499999999,
	    "NAME": "On the road, Leiden",
	    "TIME": 1659704380000
	},
	{
		"LAT":52.40090760835264,
		"LNG":4.835401777024994,
	    "NAME": "Scrapyard, Harbor Amsterdam",
	    "TIME": 1659972402000
	}
	]



	//setup map
	var map = L.map('map').setView([51.868374815532164, 4.455605206115576], 9);

	//satellite imagery
	var gl = L.mapboxGL({
	    attribution: "\u003ca href=\"https://www.maptiler.com/copyright/\" target=\"_blank\"\u003e\u0026copy; MapTiler\u003c/a\u003e \u003ca href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\"\u003e\u0026copy; OpenStreetMap contributors\u003c/a\u003e",
	        style: 'https://api.maptiler.com/maps/hybrid/style.json?key=bwAatquSGBRIMgkSnGha'
	    }).addTo(map);

	map.zoomControl.remove(); //remove default (top left controls)

	L.control.zoom({ //place controls bottom right 
	    position: 'bottomright'
	}).addTo(map);

	//custom motionline marker (not used atm)
	const size = 0; // needs to correspond to font-size above
    const iconOptions = {
      iconSize  : [size, size],
      iconAnchor: [size/2, size + 9], 
      className : 'emoMarker',
      html: '' 
      //html: '🖨️' //backup..
    }
    const markerOptions = {
      draggable: true,
      icon: L.divIcon(iconOptions)
    }

	//custom marker
	const svgIcon = L.divIcon({
		  html: `
		<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
 		 <circle cx="50" cy="50" r="50" fill="#FF0000"/>
		</svg>`,
		  className: "",
		  iconSize: [24, 40],
		  iconAnchor: [10, 10],
	});

	//markers, info popups and motion line prep
	pointsFromJson = [] // empty js array for motionLine 
	
	var addMarkers = function(point) {
	      	L.marker([point.LAT, point.LNG],  { icon: svgIcon })
	        .addTo(map)
	        .bindPopup(	point.LAT + ',' + point.LNG + '<br><br>' +
	        			point.NAME + '<br><br>' +
	        			new Date(point.TIME)
	        );
	        pointsFromJson.push([point.LAT, point.LNG]); //convert json to js array for use with motionLine
	};
		jsonData.forEach(addMarkers);


	//motion line
	var motionLine = L.motion.polyline(pointsFromJson, {
		color: "red"
		}, {
			auto: true,
			duration: 6000,
			easing: L.Motion.Ease.linear
		}, {
			removeOnEnd: false,
			showMarker: true,
			icon: L.divIcon(iconOptions)
		}).addTo(map);

	var marker = motionLine.getMarker();

	marker.on('click', onClick);

	function onClick(e) {
		//alert(this.getLatLng());
		//console.log(motionLine.getMarkers());
	}

	//center map while moving
	// marker.on('move', function() {
	// 	map.setView(this.getLatLng())
	// });


</script>
</body>
</html>
